<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abonnement confirmé · Clyento</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#F7F7F4;--surface:#FFFFFF;--ink:#111111;--muted:#5E5F59;--line:#E2E2DB;--ok:#1F8A4C}
@media (prefers-color-scheme: dark){:root{--bg:#121211;--surface:#1B1B19;--ink:#F2F2EC;--muted:#A3A39B;--line:#2E2E2A;--ok:#4CC27E;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Figtree",system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}
main{max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:36px;display:grid;gap:16px}
h1{font:800 2rem/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
p{margin:0;color:var(--muted)}
.ok{display:inline-flex;align-items:center;gap:8px;color:var(--ok);font-weight:600;font-size:.9rem}
.ok::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
a{display:inline-flex;justify-self:start;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600;padding:13px 20px;border-radius:999px}
</style>
</head>
<body>
<main>
  <span class="ok">Paiement confirmé</span>
  <h1>Bienvenue sur Clyento.</h1>
  <p>Votre abonnement est actif. Vous recevez la facture par email.</p>
  <p>Vos prospects débloqués, avec leurs décideurs et les messages prêts à envoyer, arrivent dans votre boîte mail sous 24 heures ouvrées.</p>
  <a href="/">Revenir au site</a>
</main>
</body>
</html>
